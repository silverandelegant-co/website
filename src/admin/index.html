<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İçerik Yöneticisi - Silver & Elegant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0d12;
      --accent-color: #a89078; /* Premium silver/gold tone */
      --text-color: #e4e6eb;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
    }
    #premium-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #161822 0%, #0c0d12 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
    }
    .loader-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(168, 144, 120, 0.1) 0%, rgba(0,0,0,0) 70%);
      filter: blur(30px);
      animation: pulse 4s infinite alternate;
    }
    .spinner {
      position: relative;
      width: 70px;
      height: 70px;
      border: 2px solid rgba(228, 230, 235, 0.05);
      border-top: 2px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
      box-shadow: 0 0 20px rgba(168, 144, 120, 0.15);
    }
    .loader-title {
      margin-top: 30px;
      color: var(--text-color);
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .loader-subtitle {
      margin-top: 8px;
      color: rgba(228, 230, 235, 0.5);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.1); opacity: 1; }
    }
    .loaded #premium-loader {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
  <!-- Load Turkish translations first so they are available in window scope -->
  <script src="tr.js"></script>
</head>
<body>
  <div id="premium-loader">
    <div class="loader-glow"></div>
    <div class="spinner"></div>
    <div class="loader-title">Silver & Elegant</div>
    <div class="loader-subtitle">Türkçe Yönetim Paneli Yükleniyor…</div>
  </div>

  <script>
    (async () => {
      try {
        // Fetch Sveltia CMS JS (pinned to version 0.162.0 to ensure absolute stability)
        const response = await fetch('https://unpkg.com/@sveltia/cms@0.162.0/dist/sveltia-cms.js');
        if (!response.ok) throw new Error('CMS script could not be fetched');
        
        let code = await response.text();
        
        // 1. Inject Sveltia CMS Core Turkish Translation
        code = code.replace(
          '"/src/lib/locales/ja.yaml":O6',
          '"/src/lib/locales/ja.yaml":O6,"/src/lib/locales/tr.yaml":window.turkishTranslations'
        );
        
        // 2. Inject Sveltia UI Turkish Translation
        code = code.replace(
          '"../locales/ja.yaml":pae',
          '"../locales/ja.yaml":pae,"../locales/tr.yaml":window.turkishSuiTranslations'
        );

        // 3. Set Turkish as the absolute default locale (falling back to user preferences if saved)
        code = code.replace(
          'fallbackLocale:`en`',
          'fallbackLocale:`tr`'
        );
        code = code.replace(
          /initialLocale:[A-Za-z0-9_]+\([A-Za-z0-9_]+\)\.locale\|\|\([A-Za-z0-9_]+\(\)\?\?`[^`]*`\)\.split\(`-`\)\[0\]\|\|`en`/,
          'initialLocale:A(tN).locale||`tr`'
        );

        // Execute the patched CMS code by appending it as a script element
        const script = document.createElement('script');
        script.textContent = code;
        document.body.appendChild(script);

        // Start observing DOM changes to hide loader once CMS elements render
        const observer = new MutationObserver((mutations, obs) => {
          // Look for any standard CMS container elements in body (usually dialogs, main layouts, etc.)
          const hasCmsElement = Array.from(document.body.children).some(child => {
            return child.id !== 'premium-loader' && child.tagName !== 'SCRIPT' && child.tagName !== 'LINK' && child.tagName !== 'STYLE';
          });
          
          if (hasCmsElement) {
            document.body.classList.add('loaded');
            obs.disconnect(); // stop observing once loaded
          }
        });
        
        observer.observe(document.body, { childList: true });

        // Backup safety timeout to fade out loader if observation fails for any reason
        setTimeout(() => {
          document.body.classList.add('loaded');
        }, 3000);

      } catch (err) {
        console.error('Localization Error:', err);
        const subtitle = document.querySelector('.loader-subtitle');
        if (subtitle) {
          subtitle.textContent = 'Yükleme başarısız oldu. Lütfen internet bağlantınızı kontrol edin.';
          subtitle.style.color = '#ff6b6b';
        }
      }
    })();
  </script>
</body>
</html>
