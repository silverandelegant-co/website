backend:
  name: github
  repo: silverandelegant-co/website # Update if the repo name differs
  branch: main # Branch to update

media_folder: "src/assets/pieces"
public_folder: "assets/pieces" # Setting to same ensures internal paths match fetch logic

collections:
  - name: "site_data"
    label: "Site Data"
    files:
      - file: "src/_data/site.json"
        label: "Website Content"
        name: "content"
        fields:
          - label: "Settings"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Wolf & Badger URL", name: "wolfandbadger", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }

          - label: "About Page"
            name: "about"
            widget: "object"
            fields:
              - { label: "Hero Image", name: "hero_image", widget: "image" }
              - { label: "Heading Line 1", name: "heading1", widget: "string" }
              - { label: "Heading Line 2", name: "heading2", widget: "string" }
              - { label: "Body Paragraphs", name: "body", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
              - label: "Process Steps"
                name: "process_steps"
                widget: "list"
                fields:
                  - { label: "Number", name: "num", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }

          - label: "Contact Page"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro Text", name: "intro", widget: "text" }
          
          - label: "Jewellery Pieces"
            name: "pieces"
            widget: "list"
            fields:
              - { label: "ID (URL slug - lowercase, no spaces)", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Collection", name: "collection", widget: "select", options: ["rings", "necklaces", "bracelets", "earrings"] }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Story", name: "story", widget: "text" }
              - { label: "Materials", name: "materials", widget: "list" }
              - { label: "Featured (Show on home page?)", name: "featured", widget: "boolean", default: false }
              - { label: "Wolf & Badger Listing URL (Optional)", name: "wolfandbadger", widget: "string", required: false }
              - label: "Images"
                name: "images"
                widget: "list"
                field: { label: "Image", name: "image", widget: "image" }
