backend:
  name: github
  repo: silverandelegant-co/website # Update if the repo name differs
  branch: main # Branch to update

media_folder: "src/assets/pieces"
public_folder: "assets/pieces" # Setting to same ensures internal paths match fetch logic

collections:
  - name: "settings"
    label: "Genel Ayarlar"
    files:
      - file: "src/_data/settings.json"
        label: "Mağaza Ayarları ve Bağlantılar"
        name: "settings"
        fields:
          - { label: "Instagram Adresi", name: "instagram", widget: "string" }
          - { label: "E-posta Adresi", name: "email", widget: "string" }
          - { label: "Web3Forms Erişim Anahtarı (API Key)", name: "web3forms_key", widget: "string", required: false }
          - { label: "Wolf & Badger Adresi", name: "wolfandbadger", widget: "string" }
          - { label: "More4id Adresi", name: "more4id", widget: "string" }
          - { label: "Not Just A Label Adresi", name: "njal", widget: "string", required: false }
          - { label: "Ana Sayfa Tanıtım Yazısı", name: "tagline", widget: "string" }
          - { label: "Ana Sayfa Basın Bölümü Etiketi", name: "home_press_label", widget: "string", default: "Recognition", required: false }
          - { label: "Ana Sayfa Basın Bölümü Başlığı", name: "home_press_title", widget: "string", default: "In the Press", required: false }
          - { label: "Ana Sayfa Ürünler Bölümü Etiketi", name: "home_pieces_label", widget: "string", default: "Featured Work", required: false }
          - { label: "Ana Sayfa Ürünler Bölümü Başlığı", name: "home_pieces_title", widget: "string", default: "Selected Pieces", required: false }

  - name: "pages"
    label: "Sayfa İçerikleri"
    files:
      - file: "src/_data/about.json"
        label: "Hakkımızda Sayfası"
        name: "about"
        fields:
          - { label: "Giriş (Hero) Görseli", name: "hero_image", widget: "image" }
          - label: "Bölümler"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Etiket", name: "label", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Metin", name: "body", widget: "text" }
          - label: "Süreç Adımları"
            name: "process_steps"
            widget: "list"
            fields:
              - { label: "Numara", name: "num", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }

      - file: "src/_data/press.json"
        label: "Basın Sayfası"
        name: "press"
        fields:
          - { label: "Ana Başlık", name: "heading", widget: "string" }
          - label: "Makaleler / Haberler"
            name: "articles"
            widget: "list"
            fields:
              - { label: "ID (URL kalıcı bağlantısı - küçük harf, boşluksuz)", name: "id", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Yayın Tarihi", name: "date", widget: "datetime" }
              - { label: "Özet (Liste ekranı için kısa özet)", name: "summary", widget: "text" }
              - { label: "Öne Çıkan Görsel (İsteğe Bağlı)", name: "featured_image", widget: "image", required: false }
              - { label: "Harici Orijinal Makale Linki (İsteğe Bağlı)", name: "link", widget: "string", required: false }
              - { label: "Ana Sayfada Göster", name: "featured", widget: "boolean", default: false, required: false }
              - label: "İçerik Bölümleri"
                name: "sections"
                widget: "list"
                types:
                  - label: "Metin Bloğu"
                    name: "text_block"
                    widget: "object"
                    fields:
                      - { label: "Metin İçeriği", name: "body", widget: "markdown" }
                  - label: "Alıntı"
                    name: "blockquote"
                    widget: "object"
                    fields:
                      - { label: "Alıntı Metni", name: "quote", widget: "string" }
                      - { label: "Alıntı Sahibi / Kaynak (İsteğe Bağlı)", name: "author", widget: "string", required: false }
                  - label: "Görsel Bloğu"
                    name: "image_block"
                    widget: "object"
                    fields:
                      - { label: "Görsel", name: "image", widget: "image" }
                      - { label: "Görsel Açıklaması (Alt)", name: "alt", widget: "string", required: false }
                      - { label: "Görsel Başlığı / Alt Yazı", name: "caption", widget: "string", required: false }
                  - label: "Video Bloğu"
                    name: "video_block"
                    widget: "object"
                    fields:
                      - { label: "YouTube Video Linki", name: "video_url", widget: "string" }
                      - { label: "Video Başlığı / Alt Yazı (İsteğe Bağlı)", name: "caption", widget: "string", required: false }
                  - label: "Alt Başlık"
                    name: "subheading"
                    widget: "object"
                    fields:
                      - { label: "Alt Başlık Metni", name: "text", widget: "string" }

      - file: "src/_data/contact.json"
        label: "İletişim Sayfası"
        name: "contact"
        fields:
          - { label: "Ana Başlık", name: "heading", widget: "string" }
          - { label: "Giriş Metni", name: "intro", widget: "text" }

      - file: "src/_data/sustainability.json"
        label: "Sürdürülebilirlik (Sustainability) Sayfası"
        name: "sustainability"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Meta Açıklama (SEO)", name: "meta_description", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - label: "Bölümler"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Etiket", name: "label", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Metin", name: "body", widget: "markdown" }

      - file: "src/_data/how_we_work.json"
        label: "İş Modeli (How We Work) Sayfası"
        name: "how_we_work"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Meta Açıklama (SEO)", name: "meta_description", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - label: "Bölümler"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Etiket", name: "label", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Metin", name: "body", widget: "markdown" }

      - file: "src/_data/studio.json"
        label: "Atölye & Stüdyo (Studio) Sayfası"
        name: "studio"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Meta Açıklama (SEO)", name: "meta_description", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - label: "Bölümler"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Etiket", name: "label", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Metin", name: "body", widget: "markdown" }

      - file: "src/_data/press_kit.json"
        label: "Basın Kiti (Press Kit) Sayfası"
        name: "press_kit"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Meta Açıklama (SEO)", name: "meta_description", widget: "string" }
          - { label: "Basın İletişim E-postası", name: "press_email", widget: "string" }
          - { label: "Marka Logosu (İndirilebilir)", name: "brand_logo", widget: "image", required: false }
          - { label: "Kurucu Fotoğrafı (İndirilebilir)", name: "founder_photo", widget: "image", required: false }
          - { label: "Marka Özeti Başlığı", name: "brand_summary_title", widget: "string" }
          - { label: "Marka Özeti Metni", name: "brand_summary_body", widget: "text" }
          - { label: "Kurucu Biyografisi Başlığı", name: "founder_bio_title", widget: "string" }
          - { label: "Kurucu Biyografisi Metni", name: "founder_bio_body", widget: "text" }

      - file: "src/_data/the_journey.json"
        label: "The Journey Ana Sayfası"
        name: "the_journey"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Meta Açıklama (SEO)", name: "meta_description", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - { label: "Giriş Metni", name: "intro_text", widget: "text" }

      - file: "src/_data/journey_lore.json"
        label: "The Journey - The Lore Alt Sayfası"
        name: "journey_lore"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - { label: "İçerik", name: "body", widget: "markdown" }

      - file: "src/_data/journey_metamorphosis.json"
        label: "The Journey - On Metamorphosis Alt Sayfası"
        name: "journey_metamorphosis"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - { label: "İçerik", name: "body", widget: "markdown" }

      - file: "src/_data/journey_mask.json"
        label: "The Journey - The Mask and the Hand Alt Sayfası"
        name: "journey_mask"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - { label: "İçerik", name: "body", widget: "markdown" }

      - file: "src/_data/journey_migration.json"
        label: "The Journey - Migration Notes Alt Sayfası"
        name: "journey_migration"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - { label: "İçerik", name: "body", widget: "markdown" }

      - file: "src/_data/journey_materials.json"
        label: "The Journey - Materials as Memory Alt Sayfası"
        name: "journey_materials"
        fields:
          - { label: "Sayfa Başlığı", name: "page_title", widget: "string" }
          - { label: "Giriş Görseli", name: "hero_image", widget: "image", required: false }
          - { label: "İçerik", name: "body", widget: "markdown" }

  - name: "pieces"
    label: "Takı Kataloğu"
    files:
      - file: "src/_data/earrings.json"
        label: "Küpeler Listesi"
        name: "earrings"
        fields:
          - label: "Küpeler"
            name: "pieces"
            widget: "list"
            fields: &piece_fields
              - { label: "Detay Sayfası Olmasın (Yalnızca Görsel Göster)", name: "no_detail", widget: "boolean", default: false, required: false }
              - { label: "ID (Detaylı ürünler için zorunlu - küçük harf, boşluksuz)", name: "id", widget: "string", required: false }
              - { label: "Ürün Adı", name: "name", widget: "string", required: false }
              - { label: "Koleksiyon / Kategori", name: "collection", widget: "select", options: [{ label: "Yüzükler", value: "rings" }, { label: "Kolyeler", value: "necklaces" }, { label: "Bilezikler", value: "bracelets" }, { label: "Küpeler", value: "earrings" }] }
              - { label: "Kısa Tanıtım Yazısı", name: "tagline", widget: "string", required: false }
              - { label: "Ürün Hikayesi", name: "story", widget: "text", required: false }
              - { label: "Kullanılan Malzemeler", name: "materials", widget: "list", required: false }
              - { label: "Öne Çıkarılan (Ana sayfada gösterilsin mi?)", name: "featured", widget: "boolean", default: false }
              - { label: "Wolf & Badger Ürün Sayfası Linki (İsteğe Bağlı)", name: "wolfandbadger", widget: "string", required: false }
              - { label: "More4id Ürün Sayfası Linki (İsteğe Bağlı)", name: "more4id", widget: "string", required: false }
              - { label: "Not Just A Label Ürün Sayfası Linki (İsteğe Bağlı)", name: "njal", widget: "string", required: false }
              - { label: "YouTube Tanıtım Videosu Linki (İsteğe Bağlı)", name: "video_url", widget: "string", required: false }
              - label: "Ürün Görselleri"
                name: "images"
                widget: "list"
                field: { label: "Görsel", name: "image", widget: "image" }

      - file: "src/_data/rings.json"
        label: "Yüzükler Listesi"
        name: "rings"
        fields:
          - label: "Yüzükler"
            name: "pieces"
            widget: "list"
            fields: *piece_fields

      - file: "src/_data/necklaces.json"
        label: "Kolyeler Listesi"
        name: "necklaces"
        fields:
          - label: "Kolyeler"
            name: "pieces"
            widget: "list"
            fields: *piece_fields

      - file: "src/_data/bracelets.json"
        label: "Bilezikler Listesi"
        name: "bracelets"
        fields:
          - label: "Bilezikler"
            name: "pieces"
            widget: "list"
            fields: *piece_fields

  - name: "posts"
    label: "Günlük / Blog"
    files:
      - file: "src/_data/posts_philosophy.json"
        label: "Felsefe Yazıları"
        name: "posts_philosophy"
        fields:
          - label: "Felsefe Gönderileri"
            name: "posts"
            widget: "list"
            fields: &post_fields
              - { label: "ID (URL kalıcı bağlantısı - küçük harf, boşluksuz)", name: "id", widget: "string" }
              - { label: "Yazı Başlığı", name: "title", widget: "string" }
              - { label: "Tarih", name: "date", widget: "datetime" }
              - { label: "Kategori", name: "category", widget: "select", options: [{ label: "Felsefe", value: "Philosophy" }, { label: "Zanaatkarlık", value: "Craftsmanship" }, { label: "Basın", value: "Press" }, { label: "Sergiler", value: "Exhibitions" }] }
              - { label: "Özet (Liste ekranı için kısa özet)", name: "summary", widget: "text" }
              - { label: "Öne Çıkan Görsel", name: "featured_image", widget: "image" }
              - { label: "Öne Çıkarılan Yazı? (Günlüğün en üstünde gösterilsin mi?)", name: "featured", widget: "boolean", default: false }
              - label: "İçerik Bölümleri"
                name: "sections"
                widget: "list"
                types:
                  - label: "Metin Bloğu"
                    name: "text_block"
                    widget: "object"
                    fields:
                      - { label: "Metin İçeriği", name: "body", widget: "markdown" }
                  - label: "Alıntı"
                    name: "blockquote"
                    widget: "object"
                    fields:
                      - { label: "Alıntı Metni", name: "quote", widget: "string" }
                      - { label: "Alıntı Sahibi / Kaynak (İsteğe Bağlı)", name: "author", widget: "string", required: false }
                  - label: "Görsel Bloğu"
                    name: "image_block"
                    widget: "object"
                    fields:
                      - { label: "Görsel", name: "image", widget: "image" }
                      - { label: "Görsel Açıklaması (Alt)", name: "alt", widget: "string", required: false }
                      - { label: "Görsel Başlığı / Alt Yazı", name: "caption", widget: "string", required: false }
                  - label: "Video Bloğu"
                    name: "video_block"
                    widget: "object"
                    fields:
                      - { label: "YouTube Video Linki", name: "video_url", widget: "string" }
                      - { label: "Video Başlığı / Alt Yazı (İsteğe Bağlı)", name: "caption", widget: "string", required: false }
                  - label: "Alt Başlık"
                    name: "subheading"
                    widget: "object"
                    fields:
                      - { label: "Alt Başlık Metni", name: "text", widget: "string" }

      - file: "src/_data/posts_craftsmanship.json"
        label: "Zanaatkarlık Notları"
        name: "posts_craftsmanship"
        fields:
          - label: "Zanaatkarlık Gönderileri"
            name: "posts"
            widget: "list"
            fields: *post_fields

      - file: "src/_data/posts_press.json"
        label: "Basın & LFW Köşe Yazıları"
        name: "posts_press"
        fields:
          - label: "Basın Gönderileri"
            name: "posts"
            widget: "list"
            fields: *post_fields

      - file: "src/_data/posts_exhibitions.json"
        label: "Sergi Kayıtları"
        name: "posts_exhibitions"
        fields:
          - label: "Sergi Gönderileri"
            name: "posts"
            widget: "list"
            fields: *post_fields
